<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      color: #fff;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .form-control {
      border-radius: 30px;
      padding: 12px 18px;
      font-size: 1rem;
      background-color: rgba(255, 255, 255, 0.9);
      border: none;
    }

    .form-control:focus {
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.4);
    }

    .btn-login {
      border-radius: 30px;
      padding: 10px;
      background-color: #5a67d8;
      border: none;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .btn-login:hover {
      background-color: #434190;
    }

    .text-link {
      font-size: 0.95rem;
      color: #e0e0e0;
      text-decoration: none;
    }

    .text-link:hover {
      text-decoration: underline;
      color: #ffffff;
    }

    .invalid-feedback {
      color: #ffc9c9;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <form id="loginForm" method="post" action="/myapp/login_post/" novalidate>
        {% csrf_token %}
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          class="form-control"
          id="username"
          name="username"
          placeholder="Enter your username"
          required
          minlength="3">
        <div class="invalid-feedback">
          Please enter a username (at least 3 characters).
        </div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          placeholder="Enter your password"
          required>
        <div class="invalid-feedback" id="passwordError">
          Password must be at least 6 characters and include a capital letter, a symbol, and a number.
        </div>
      </div>
        <button type="submit" class="btn btn-login w-100">Login</button>
    </form>
    <div class="text-center mt-3">
      <a href="#" class="text-link">Forgot Password?</a>
    </div>
    <div class="text-center mt-2">
      <a href="/myapp/c_registration/" class="text-link">Create Company Account</a><br>
      <a href="/myapp/u_registration/" class="text-link">Create User Account</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      'use strict';
      window.addEventListener('load', function () {
        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const passwordError = document.getElementById('passwordError');

        form.addEventListener('submit', function (event) {
          let valid = true;

          const password = passwordInput.value;
          const isLongEnough = password.length >= 6;
{#          const hasUppercase = /[A-Z]/.test(password);#}
{#          const hasSymbol = /[!@#$%^&*(),.?":{}|<>]/.test(password);#}
{#          const hasNumber = /[0-9]/.test(password);#}
{##}
{#          if (!isLongEnough || !hasUppercase || !hasSymbol || !hasNumber) {#}
{#            passwordInput.classList.add('is-invalid');#}
{#            passwordError.style.display = 'block';#}
{#            valid = false;#}
{#          } else {#}
{#            passwordInput.classList.remove('is-invalid');#}
{#            passwordInput.classList.add('is-valid');#}
{#          }#}

          if (!form.checkValidity() || !valid) {
            event.preventDefault();
            event.stopPropagation();
          }

          form.classList.add('was-validated');
        }, false);
      });
    })();
  </script>
</body>
</html>
