{#<body>#}

  <div class="container">
    <h2>Generate Statistics</h2>

    <form id="reportForm" novalidate>
      <div class="row g-4">
        <div class="col-md-6">
          <label for="startDate">Start Date</label>
          <input type="date" id="startDate" name="startDate" required />
        </div>
        <div class="col-md-6">
          <label for="endDate">End Date</label>
          <input type="date" id="endDate" name="endDate" required />
        </div>
        <div class="col-md-12">
          <label for="reportType">Report Type</label>
          <select id="reportType" name="reportType" required>
            <option value="" disabled selected>Select report type</option>
            <option value="applications">Applications</option>
            <option value="internships">Internships</option>
            <option value="companies">Companies</option>
            <option value="students">Students</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-generate">Generate Report</button>
    </form>

    <div id="reportResult">
      <!-- Report data will appear here -->
{#      <p class="text-center">Select date range and report type, then click "Generate Report".</p>#}
    </div>
  </div>

  <script>
    document.getElementById('reportForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const startDate = this.startDate.value;
      const endDate = this.endDate.value;
      const reportType = this.reportType.value;

      const resultDiv = document.getElementById('reportResult');

      // Simple validation
      if (!startDate || !endDate || !reportType) {
        resultDiv.innerHTML = '<p class="text-danger text-center">Please fill all fields correctly.</p>';
        return;
      }
      if (startDate > endDate) {
        resultDiv.innerHTML = '<p class="text-danger text-center">Start Date cannot be after End Date.</p>';
        return;
      }

      // Placeholder: you can replace this with real AJAX call to fetch report data
      resultDiv.innerHTML = `<p class="text-center">Generating <strong>${reportType}</strong> report from <strong>${startDate}</strong> to <strong>${endDate}</strong>...</p>`;

      // Simulate loading and report generation delay
      setTimeout(() => {
        resultDiv.innerHTML = `
          <h4 class="text-center">Report: ${reportType.charAt(0).toUpperCase() + reportType.slice(1)}</h4>
          <p><strong>Date Range:</strong> ${startDate} to ${endDate}</p>
          <p>This is a placeholder for the ${reportType} report content.</p>
          <ul>
            <li>Total count: 123</li>
            <li>Active: 100</li>
            <li>Inactive: 23</li>
          </ul>
        `;
      }, 1500);
    });
  </script>
