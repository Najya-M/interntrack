<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assign Tasks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css"/>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      padding: 40px;
    }
    .table-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      color: #fff;
    }
{#    table.dataTable thead th {#}
{#      color: #fff;#}
{#    }#}
    .dataTables_filter input {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      border: none;
      padding: 8px 12px;
    }
    .btn-upload {
      background-color: #6c63ff;
      color: white;
      border-radius: 30px;
      padding: 5px 15px;
      font-size: 14px;
    }
    .btn-upload:hover {
      background-color: #5848d3;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container table-container">
    <h2 class="text-center mb-4">Assign Tasks</h2>

    <!-- Add New Task Form -->
    <form class="mb-4" method="post" action="/myapp/c_add_task_post/">
    {% csrf_token %}

      <div class="row g-3"><input type="hidden" name="aid" value="{{ data.id }}">
        <div class="col-md-2"><input type="hidden" name="internshipId" value="{{ data.INTERNSHIP.id }}">
            <input type="text" name="" class="form-control" value="{{ data.INTERNSHIP.title }}" readonly>
{#            <select class="form-control" name="internshipId" placeholder="Internship ID" required>#}
{#                {% for i in data %}#}
{#                <option value="{{ i.id }}">{{ i.title }}</option>#}
{#                {% endfor %}#}
{#            </select>#}
        </div>

          <div class="col-md-2">
          <input type="text" class="form-control" name="title" placeholder="Title" required>
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" name="description" placeholder="Description" required>
        </div>
        <div class="col-md-1">
          <input type="date" class="form-control" min="{{ date|date:'Y-m-d' }}" name="assigned_date" placeholder="Assigned Date" required>
        </div>
        <div class="col-md-1">
          <input type="date" class="form-control" min="{{ date|date:'Y-m-d' }}" name="due_date" placeholder="Due Date" required>
        </div>
        <div class="col-md-1">
          <button type="submit" class="btn btn-light">Add</button>
        </div>
      </div>
    </form>

    <!-- Tasks Table -->
    <div class="table-responsive">
      <table id="tasksTable" class="table table-striped table-hover  align-middle">
        <thead>
          <tr style="color: #0b0b0b">
            <th>Serial No</th>
            <th>Internship Name</th>
            <th>Title</th>
            <th>Description</th>
            <th>Assigned Date</th>
            <th>Due Date</th>
            <th>Manage</th>
          </tr>
        </thead>
        <tbody>
          <!-- Example Data -->
          {% for i in t %}
          <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.INTERNSHIP.name }}</td>
            <td>{{ i.title }}</td>
            <td>{{ i.description }}</td>
            <td>{{ i.assigned_date }}</td>
            <td>{{ i.due_date }}</td>
            <td>
            <a href="/myapp/c_delete_task/{{ i.id }}" onclick="return confirm('Are You Sure?')" class="btn btn-danger">Delete</a></td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script>
    $(document).ready(function () {
      $('#tasksTable').DataTable({
        pageLength: 5,
        lengthMenu: [5, 10, 20],
      });
    });
  </script>
</body>
</html>
