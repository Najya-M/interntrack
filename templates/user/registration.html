<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .registration-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      max-width: 700px;
      width: 100%;
      color: #fff;
    }

    .form-label {
      font-weight: 500;
      color: #eee;
    }

    .form-control {
      border-radius: 25px;
      padding: 10px 18px;
      border: none;
      background-color: rgba(255, 255, 255, 0.85);
    }

    .form-control:focus {
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.4);
    }

    textarea.form-control {
      border-radius: 20px;
    }

    .btn-primary {
      border-radius: 25px;
      padding: 10px;
      font-weight: 600;
      background-color: #5a67d8;
      border: none;
      transition: 0.3s;
    }

    .btn-primary:hover {
      background-color: #434190;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: bold;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="registration-box">
    <h2>Registration Form</h2>
    <form method="post" enctype="multipart/form-data" action="/myapp/registration_post/">
        {% csrf_token %}
      <div class="row mb-3">
        <label for="name" class="col-sm-4 col-form-label">Full Name</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" name="name" id="name" required>
        </div>
      </div>

      <div class="row mb-3">
        <label class="col-sm-4 col-form-label">Gender</label>
        <div class="col-sm-8">
          <div class="form-check form-check-inline text-white">
            <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
            <label class="form-check-label" for="male">Male</label>
          </div>
          <div class="form-check form-check-inline text-white">
            <input class="form-check-input" type="radio" name="gender"   id="female" value="female" required>
            <label class="form-check-label" for="female">Female</label>
          </div>
          <div class="form-check form-check-inline text-white">
            <input class="form-check-input" type="radio" name="gender" id="other" value="others" required>
            <label class="form-check-label" for="other">Other</label>
          </div>
        </div>


      </div>

      <div class="row mb-3">
        <label for="dob" class="col-sm-4 col-form-label">Date of Birth</label>
        <div class="col-sm-8">
          <input type="date" class="form-control" name="dob" id="dob" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="email" class="col-sm-4 col-form-label">Email address</label>
        <div class="col-sm-8">
          <input type="email" class="form-control" name="email" id="email" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 col-form-label">Phone Number</label>
        <div class="col-sm-8">
          <input type="tel" pattern="[0-9]{10}" class="form-control" name="phone" id="phone" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="address" class="col-sm-4 col-form-label">Place</label>
        <div class="col-sm-8">
          <input class="form-control" name="place" id="place" required>
        </div>
      </div>

        <div class="row mb-3">
        <label for="address" class="col-sm-4 col-form-label">City</label>
        <div class="col-sm-8">
          <input class="form-control" name="city" id="city" required>
        </div>
      </div>
        <div class="row mb-3">
        <label for="address" class="col-sm-4 col-form-label">Pincode</label>
        <div class="col-sm-8">
          <input class="form-control" name="pincode" id="pincode" required>
        </div>
      </div>



        <div class="row mb-3">
        <label for="address" class="col-sm-4 col-form-label">State</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" name="state" id="state" required>
        </div>
      </div>


      <div class="row mb-3">
        <label for="photo" class="col-sm-4 col-form-label">Upload Photo</label>
        <div class="col-sm-8">
          <input type="file" class="form-control" name="photo" id="photo" accept="image/*" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="password" class="col-sm-4 col-form-label">Password</label>
        <div class="col-sm-8">
          <input type="password" class="form-control" name="password" id="password" minlength="6" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="confirmPassword" class="col-sm-4 col-form-label">Confirm Password</label>
        <div class="col-sm-8">
          <input type="password" class="form-control" name="confirmPassword" id="confirmPassword" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit"  class="btn btn-primary w-100">Register</button>
{#            <a href="" class="btn btn-primary w-100">Register</a>#}
            </div>
{#            <div class="ms-auto">#}
{#        <a href="/myapp/userHome/" class="btn btn-outline-light btn-login">Login</a>#}
{#      </div>#}

      </div>
    </form>
  </div>
</body>
</html>
